# Render blueprint — deploy config for the Flipkart-MERN web service.
# Repo was originally written for Render (see "render-postbuild" in package.json).
services:
  - type: web
    name: flipkart-mern
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # --- Secrets: entered when you create the service from this blueprint ---
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # --- Regular config (same values as backend/config/config.env) ---
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_EXPIRE
        value: 5
      - key: PAYMENT_BKASH_NUMBER
        value: "01700000000"
